name: Build Unsigned IPA

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Xcode project
        run: |
          xcodebuild -project ARTraceAndDraw.xcodeproj \
          -scheme ARTraceAndDraw \
          -configuration Release \
          -sdk iphoneos \
          IPHONEOS_DEPLOYMENT_TARGET=26.0 \
          CONFIGURATION_BUILD_DIR=build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          mv build/ARTraceAndDraw.app build/Payload/
          cd build
          zip -qr ARTraceAndDraw.ipa Payload

      - name: Auto-update version in apps.json
        run: |
          NEW_VER="1.0.${{ github.run_number }}"
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$NEW_VER\"/" apps.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Auto-update apps.json version to $NEW_VER" || echo "No changes"
          git push

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          files: build/ARTraceAndDraw.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
